er attending","two rooms one attending"],keywords:["room","rooms","room a","room b","attending","oversee","third room"],answer:[Ne("The guide names a usual dental room when there is one room and a usual pair when there are two (room numbers are in the guide, p. 12). On some occasions there will be a third room. One attending can only oversee 2 rooms."),At("The scheduler labels rooms Room A / Room B by default, supports one or two rooms, and room labels are editable.")],citations:[{source:"guide",page:12,section:"OR (GA) – In OR procedure room"},{source:"config",section:"Settings → Default room numbers"}],reminders:["Be sure the correct attending is assigned to each case (guide p. 9)."]},{id:"start-times",category:"OR scheduling",question:"What time does the first OR case start each weekday?",alternates:["first case time","scheduled or time wednesday","what time is the or start","start time monday","7:15","8:15"],keywords:["start","time","first case","wednesday","monday","tuesday","thursday","friday","scheduled or time"],answer:[At("Scheduler defaults: Monday, Tuesday, Thursday, Friday 7:15 AM; Wednesday 8:15 AM. These are scheduled OR times (not arrival times), are user-defined, and can be overridden. Weekends require a manually entered start time."),Ne("The residency guide does not list OR start times. It notes a clinic morning huddle at 7:45 am and first school-clinic patients at 9:00 am — neither is an OR start time.")],citations:[{source:"config",section:"Settings → Default weekday scheduled OR times"},{source:"guide",page:3,section:"WAC/Smile Suite – Morning Huddle"}],reminders:[]},{id:"arrival-time",category:"OR scheduling",question:"How early should patients arrive before the scheduled OR time?",alternates:["arrival time","when should the family arrive","how early to arrive","75 minutes","90 minutes","hour and a half early"],keywords:["arrival","arrive","early","hour and a half","90","75","offset"],answer:[At("This scheduler uses a default arrival of 75 minutes before the scheduled OR time (configurable). Example: scheduled 7:15 AM → arrival 6:00 AM."),Ne("The residency guide's NPO-call instructions say to tell families to come an hour and a half (90 minutes) early to the scheduled start time. The 75-minute app default is a user preference and differs from that reference — verify which applies.")],citations:[{source:"config",section:"Settings → Arrival offset"},{source:"guide",page:10,section:"NPO Call"}],reminders:["The guide lists 1.5 hours prior for PSU/IV appointments as well (p. 18)."]},{id:"room-hours",category:"OR scheduling",question:"How many case-hours should a room hold?",alternates:["8 hour limit","room utilization","too many hours in a room","how full can a room be","over eight hours"],keywords:["hours","utilization","eight","8 hours","target","limit","block"],answer:[At("The scheduler uses a recommended 8 case-hours per room as a soft target only. Rooms may exceed it; an amber warning shows the excess and suggests rebalancing, but scheduling is never blocked."),hl("Neither source document states a maximum number of case-hours per room.")],citations:[{source:"config",section:"Settings → Recommended room-hour target"}],reminders:[]},{id:"block-template",category:"OR scheduling",question:"What does the Block Time Utilization table show?",alternates:["block schedule","block time","which codes go on which week","site 1 1st 2nd 3rd week","site 2 block"],keywords:["block","utilization","template","week","site","room1","room2"],answer:[si(`The coding document's Block Time Utilization table lists, for the main OR site by week of the month (1st–5th) and a second site (4–12 weekly), the code mix per room by weekday — e.g. Tuesday Room 1 in week 1: 1 U, 1 U, 1 R/U, 1 R/U; Wednesday Room 1: 2U, 2U, 2R/U. Monday main-site blocks are N/A. Some cells use notation such as "4R(2)/U(2)", "3RT/UT" and "2 or 3 RCC".`),At('The scheduler does not enforce this block template; it is shown here for reference. "3RT/UT" is not defined in the document.')],citations:[{source:"coding",page:3,section:"Block Time Utilization"}],reminders:["The guide notes where the block schedule is stored (p. 25)."]},{id:"mesiodens-wednesday",category:"OR scheduling",question:"Which day are mesiodens extractions or OMFS joint cases scheduled?",alternates:["mesiodens","omfs joint case day","which attending for omfs","wednesday attending"],keywords:["mesiodens","omfs","wednesday","attending","joint"],answer:[Ne("If a mesiodens extraction or a joint case with OMFS in the OR, schedule with the designated attending on Wednesdays (named in the guide, p. 6).")],citations:[{source:"guide",page:6,section:"OR Referrals"}],reminders:["The scheduler never changes the day or attending automatically for joint cases."]},{id:"add-on",category:"OR scheduling",question:"How do I add on an urgent OR case?",alternates:["add on case","add-on approval","urgent case less than 24 hours","emergency or case"],keywords:["add-on","add on","urgent","24 hours","approval","control desk"],answer:[Ne("Any add-on procedure for the main OR after 10am during the week with urgency <24 hours goes through the add-on approval process: an email (using the guide's template: Patient Name, MRN, Procedure, Surgeon, Case Urgency and Rationale) to the four approvers listed in the guide (p. 15). Exceptions: urgency <6 hours, VP shunts, fractures, appendectomies, airway foreign bodies. Tell the parent the patient will be seen the following day after other patients (no specific time); on that day tell the Control Desk about the add-on, then again ~15–20 min before you are ready. Case request: classification G (schedule in 24 hours), add the date, change to Inpatient if relevant.")],citations:[{source:"guide",page:15,section:"OR Add-On"},{source:"guide",page:16,section:"Case Request (add-on)"}],reminders:["Do not put patient names or MRNs into this scheduler — complete the add-on email in an approved institutional system."]},{id:"day-of-changes",category:"OR scheduling",question:"How are last-minute cancellations or attending corrections handled on the day of surgery?",alternates:["cancellation day of surgery","change attending morning","last minute change"],keywords:["cancellation","cancel","last minute","control desk","attending correction"],answer:[Ne("Any changes, including last-minute cancellations or attending corrections, can be made with the control desk in the morning.")],citations:[{source:"guide",page:9,section:"OR (GA)"}],reminders:["Add cancellation notes in the scheduler so the schedule email reflects them."]},{id:"private-room",category:"OR scheduling",question:"How do I request a private (solo) room?",alternates:["solo room","private room request","room request email"],keywords:["private","solo","room request"],answer:[At("The scheduler's Email Center provides a private-room request template (recipient set in Settings) with name, MRN and reason left as blanks to complete in an approved institutional email system. This template is a user-supplied workflow."),hl("The residency guide does not describe a private/solo room request process.")],citations:[{source:"config",section:"Email Center → Private Room Request"}],reminders:[]},{id:"first-case-list",category:"First-case considerations",question:"Which patients should be the first case of the day?",alternates:["first case of the day","1st case","who goes first","first case priority","which conditions go first"],keywords:["first case","1st case","first","muscular dystrophy","autism","diabetes","prader-willi","admitted night before","age"],answer:[Ne('"1st case of the day in OR": Age; Muscular dystrophy (risk of malignant hyperthermia); Autism (if self-injurious); Diabetes; Prader-Willi Syndrome; If admitted night before (not due to ED admit).'),At('The scheduler treats these as clinician-reviewed considerations that raise soft priority. Only the "Mandatory first case — clinician confirmed" checkbox makes first-slot placement a hard requirement.')],citations:[{source:"guide",page:16,section:"OR Scheduling Details – 1st case of the day in OR"}],reminders:['The guide lists "Age" without a threshold; the scheduler places younger patients earlier as a soft preference.']},{id:"first-case-capacity",category:"First-case considerations",question:"What happens if there are more mandatory first cases than rooms?",alternates:["three first cases two rooms","too many first cases","two first cases"],keywords:["first case","conflict","three","two rooms","simultaneous"],answer:[At("With two rooms, two mandatory first cases start simultaneously (one per room). Three mandatory first cases with two rooms — or two with one room — is shown as a hard conflict; the scheduler does not silently demote anyone and blocks finalization until resolved."),hl("The residency guide does not address this situation.")],citations:[{source:"config",section:"Scheduling engine – first-case rule"}],reminders:[]},{id:"malignant-hyperthermia",category:"First-case considerations",question:"Why do muscular dystrophy patients go first?",alternates:["muscular dystrophy first case","malignant hyperthermia"],keywords:["muscular dystrophy","malignant hyperthermia","md"],answer:[Ne('The guide lists muscular dystrophy under "1st case of the day in OR" with the note "risk of malignant hyperthermia". It gives no further protocol.')],citations:[{source:"guide",page:16,section:"OR Scheduling Details"}],reminders:["First-case placement still requires clinician confirmation in the scheduler."]},{id:"codes-overview",category:"Case classification",question:"What do the case codes (1R, 2U, 3RCC, 4R2…) mean?",alternates:["case codes","what is 2U","what is 3RCC","R vs U","code definitions","what does 4R2 mean"],keywords:["code","codes","1r","1u","2r","2u","3r","3u","4r","4u","4r2","4u2","2rcc","3rcc","regular","urgent","routine"],answer:[si('R = Regular, U = Urgent. 1-series "Short <1 Hour"; 2-series "Short >1 Hour"; 3-series "Long >2 Hour"; 4-series "Long >3 Hour". 4R2/4U2 are 2-part cases (extensive work needing more than one appointment). 2RCC = Routine Care Case, no previous findings; 3RCC = Routine Care Case, previous findings (patient seen every year or two).'),At("Default scheduled durations (1–4 h by series; 2RCC 2 h, 3RCC 3 h; 4R2/4U2 = current appointment only) are editable estimates, not institutional durations.")],citations:[{source:"coding",page:1,section:"Code definitions"},{source:"config",section:"Settings → Code-duration defaults"}],reminders:[]},{id:"decision-tree",category:"Case classification",question:"How does the coding decision tree work?",alternates:["decision tree","how to code a case","which code should I pick","coding questions"],keywords:["decision tree","tree","pain","extractions","8 and younger","radiographs","teeth","examine"],answer:[si('Start: "Is the patient in pain or needs extractions?" Yes → Urgent, No → Regular. Then "Is the Patient 8 and Younger?" ≤8: "Is the case limited to SSC and limited esthetic work with radiographs?" (Yes → 1U/1R, No → 2U/2R). >8 urgent: radiographs and ≤5 teeth → 2U; otherwise "Were we able to examine the patient in clinic?" No → 3U; Yes → fewer than 8 teeth → 3U, else 4U. >8 regular: "Is this patient seen every 1-2 years in the OR?" Yes → extensive work previously? 3RCC : 2RCC. No → same radiograph/exam/teeth path giving 2R, 3R or 4R.')],citations:[{source:"coding",page:2,section:"Decision Tree"}],reminders:["Use the guided questionnaire in each patient's Coding tab."]},{id:"coding-ambiguities",category:"Case classification",question:"Where does the decision tree differ from the written code definitions?",alternates:["joint case code","when is it 4R2","is an 8 year old 8 and younger","ambiguous code","manual code selection"],keywords:["ambiguous","joint case","4r2","4u2","eight","manual","override"],answer:[si('Definitions list 4R2/4U2 (more than one appointment) and "0-8 age that is a joint case" under 3R/3U, but the diagram has no branch for either. The diagram also does not define whether "8 and younger" includes a child past the 8th birthday.'),At("The scheduler asks an extra definition-based question for 4R/4U → 4R2/4U2, requires manual code selection for 0–8 joint cases, and requires a manual answer for age 8 years + months. Manual overrides are always preserved.")],citations:[{source:"coding",page:1,section:"Code definitions"},{source:"coding",page:2,section:"Decision Tree"}],reminders:[]},{id:"routine-care",category:"Case classification",question:"When is a case a routine care case (2RCC or 3RCC)?",alternates:["routine care","rcc","seen every year in the or","recall in or"],keywords:["routine","rcc","2rcc","3rcc","every year","previous findings"],answer:[si('Routine care codes appear only on the Regular, older-than-8 branch: "Is this patient seen every 1-2 years in the OR?" → Yes → "Did the patient have extensive work previously?" Yes → 3RCC (significant findings in previous years); No → 2RCC (very little to no significant findings).')],citations:[{source:"coding",page:2,section:"Decision Tree"},{source:"coding",page:1,section:"Code definitions"}],reminders:["Routine-care durations are configurable estimates in Settings."]},{id:"case-request-procedure",category:"Case classification",question:"Which procedure and case classification do I choose in the Epic case request?",alternates:["41899","reconstruction full mouth","h-elective","case request procedure","dx code k02.9"],keywords:["41899","reconstruction","full mouth","elective","h-elective","k02.9","case classification","procedure"],answer:[Ne("Add procedures: 4+ hr – RECONSTRUCTION, FULL MOUTH; type 41899 to bring up options and choose 1 hr, 2 hr or 3 hr. Laterality N/A; Anesthesia – General. Dx association: Dental caries K02.9 (if no caries, use gingivitis, etc.). Case classification: H-Elective (unless add-on – G – schedule in 24 hours).")],citations:[{source:"guide",page:6,section:"OR Referrals – Case Request Operating Room"}],reminders:['Epic "case classification" (H/G) is different from the dental case codes (1R…4U2).']},{id:"cpm-case-request",category:"CPM/PAT",question:"Where is CPM/PAT recorded in the case request?",alternates:["cpm pat evaluation","pat evaluation yes or no","cpm in case request","center for perioperative medicine"],keywords:["cpm","pat","evaluation","case request","perioperative"],answer:[Ne('In the case request, answer "CPM/PAT Evaluation: Yes or No". After signing, open the order → Questions tab → "No bed needed" (or "bed needed following recovery" if the patient will be admitted per CPM), and be sure CPM/PAT Evaluation is correct.')],citations:[{source:"guide",page:7,section:"OR Referrals – Case Request"}],reminders:["The CPM (Center for Perioperative Medicine) phone number is listed on guide p. 22."]},{id:"cpm-not-scheduled",category:"CPM/PAT",question:"What if a patient needs CPM but it is not scheduled?",alternates:["cpm not scheduled","who to message for cpm","cpm appointment missing"],keywords:["cpm","not scheduled","message","confirmation call"],answer:[Ne("During the 1-month confirmation call, check for CPM. If they need it and it is not scheduled, message one of the three CPM contacts listed in the guide (p. 10).")],citations:[{source:"guide",page:10,section:"1 month confirmation calls"}],reminders:["Track CPM needed / scheduling / follow-up status on the patient's Clinical tab."]},{id:"cpm-parent-instructions",category:"CPM/PAT",question:"What should parents be told about CPM and the physical at OR referral?",alternates:["updated physical","physical within 1 year","pcp physical","or referral instructions"],keywords:["physical","pcp","one year","cpm","instructions","referral"],answer:[Ne("At OR referral, scan the QR code and go over instructions with parents — especially CPM and the importance of an updated physical within 1 year of the OR appointment.")],citations:[{source:"guide",page:6,section:"OR Referrals"}],reminders:['Use the "PCP/physical checked" box on each patient.']},{id:"cardiac-cpm-note",category:"CPM/PAT",question:"Does the CPM note mention cardiac anesthesia?",alternates:["cardiac anesthesiologist cpm note"],keywords:["cpm note","anesthesiologist","cardiac"],answer:[Ne("Under Cardiac Anesthesia, the guide notes the cardiac anesthesiologist will most likely be mentioned in the CPM note.")],citations:[{source:"guide",page:15,section:"Cardiac Anesthesia"}],reminders:[]},{id:"cardiac-anesthesia",category:"Cardiac anesthesia",question:"What coordination is needed for a cardiac anesthesia patient?",alternates:["cardiac anesthesia","heart patient anesthesia","message cardiac anesthesiologist","cardiac patient or"],keywords:["cardiac","anesthesia","anesthesiologist","heart","first","admitted day prior"],answer:[Ne('Message the cardiac anesthesiologist (named in the guide, p. 15) to make them aware of room, time, etc. You may not get a response, but make sure the message is marked "read" — a screenshot is recommended as proof of receipt. The patient will be admitted the day prior — have the patient go 1st of the day.'),At('The scheduler shows cardiac reminders (team notified, coordination, preoperative admission) but does NOT make first-case placement mandatory until a clinician checks "Mandatory first case — clinician confirmed".')],citations:[{source:"guide",page:15,section:"Cardiac Anesthesia"},{source:"guide",page:16,section:"Admit night before OR"}],reminders:['Guide p. 16 also lists "Cardiac anesthesia required" under "Admit night before OR".']},{id:"anesthesia-devices",category:"Cardiac anesthesia",question:"What anesthesia coordination is needed for pacemakers, vagal nerve stimulators, sleep apnea, ventilator dependence or bleeding disorders?",alternates:["pacemaker","vagal nerve stimulator","vns","obstructive sleep apnea","osa","ventilator","trach","bleeding disorder","hemophilia","von willebrand"],keywords:["pacemaker","vagal","stimulator","sleep apnea","osa","ventilator","bleeding","hemophilia"],answer:[hl("Not covered: the uploaded residency guide and coding document do not describe coordination for pacemakers, vagal nerve stimulators, obstructive sleep apnea, ventilator dependence or bleeding disorders."),At('The scheduler offers an optional "Additional Anesthesia Coordination" checklist (pacemaker, VNS, OSA, ventilator dependence, bleeding disorder, sickle cell, muscular dystrophy, endocrinology follow-up) to track status. It is user-specified and creates reminders only — it never sets admission, first-case placement or clearance.')],citations:[{source:"config",section:"Patient → Clinical → Additional Anesthesia Coordination"}],reminders:["Confirm requirements with anesthesia and the relevant service."],notCovered:!0},{id:"admit-night-before",category:"Preoperative admission",question:"Which patients are admitted the night before the OR?",alternates:["admit night before","preop admission","admission before surgery","sickle cell admission","admitted day prior"],keywords:["admit","admission","night before","preoperative","sickle cell","cardiac","diabetes"],answer:[Ne('"Admit night before OR": Sickle cell; Cardiac anesthesia required; Poorly controlled diabetes (possible). Separately, "If admitted night before (not due to ED admit)" appears in the 1st-case list.'),At("The scheduler never decides admission. Preoperative admission is tracked as Not required / Requested / Pending review / Confirmed.")],citations:[{source:"guide",page:16,section:"OR Scheduling Details – Admit night before OR"}],reminders:[]},{id:"diabetes",category:"Preoperative admission",question:"How should poorly controlled diabetes be handled for scheduling?",alternates:["diabetic patient","poorly controlled diabetes","diabetes first case","endocrinology"],keywords:["diabetes","diabetic","poorly controlled","endocrinology"],answer:[Ne('The guide lists "Diabetes" under 1st case of the day and "Poorly controlled diabetes (possible)" under Admit night before OR. It gives no further protocol.'),At("The scheduler shows an endocrinology/anesthesia review reminder and prompts you to verify admission requirements. It does not assign admission, first-case priority or medical clearance.")],citations:[{source:"guide",page:16,section:"OR Scheduling Details"}],reminders:[]},{id:"pcrs",category:"Postoperative admission",question:"Who do I contact if a patient will be admitted after the procedure?",alternates:["post op admission","pcrs","admit after surgery","postoperative admission","bed after recovery"],keywords:["pcrs","postoperative","post-op","admitted","admission","after procedure","bed"],answer:[Ne("Contact PCRS if the patient is expected to be admitted post-procedure; provide patient information, when they will need to be admitted, etc. The guide lists separate PCRS numbers for business hours (until 11 pm weekdays / 4 pm weekends) and after hours, plus resident and attending pagers (p. 16; also p. 22).")],citations:[{source:"guide",page:16,section:"PCRS"},{source:"guide",page:22,section:"Useful Phone Numbers"}],reminders:['In the case request Questions tab, select "bed needed following recovery" if the patient will be admitted per CPM (p. 7).',"The PCRS numbers on guide p. 16 and p. 22 differ by one digit — verify."]},{id:"guardianship",category:"Guardianship",question:"What guardianship or consent paperwork is needed?",alternates:["guardian not parent","foster consent","red border","adoption paperwork","over 18 guardianship","power of attorney","social worker consent"],keywords:["guardianship","guardian","consent","foster","adoption","red border","power of attorney","18","ap144b"],answer:[Ne('Adoption: red border form (1 extra form for patients in a particular county — see guide p. 13). Guardianship: proof of guardianship needed. Parents need the guardianship process completed if the patient is 18+. NPO-call list: over 18 must have legal guardianship paperwork/power of attorney; if foster, red border consent needed; for social worker, Ap144B form needed for consent and guardianship. If the guardian is not the biological parent, be sure proper paperwork is in and note it on the blue sticky note (e.g. "Guardianship paperwork scanned [date]").')],citations:[{source:"guide",page:13,section:"Guardianship"},{source:"guide",page:10,section:"NPO Call"},{source:"guide",page:3,section:"Working Up Assigned Columns"}],reminders:["Scheduler acknowledgment of missing paperwork is administrative only — it is not legal clearance.","Never enter guardian names in the scheduler."]},{id:"turning-18",category:"Guardianship",question:"What if a patient is about to turn 18 and the parent has not started guardianship?",alternates:["soon to be 18","legal aid guardianship","medical legal partnership"],keywords:["18","legal aid","medical-legal","partnership","guardianship"],answer:[Ne("If the patient is soon to be 18 and the parent will need guardianship but has not started or does not know how, give them the legal aid / medical-legal partnership email listed in the guide (p. 14).")],citations:[{source:"guide",page:14,section:"Guardianship"}],reminders:[]},{id:"confirmation-call",category:"NPO and confirmation calls",question:"How do I do the 1-month confirmation call?",alternates:["one month call","confirmation call","confirmation call smart phrase","cannot reach family"],keywords:["confirmation","call","one month","1 month","three attempts","smart phrase"],answer:[Ne("Create a telephone encounter (change name). Smart phrases (named in the guide) list everything to go over; the OR workup sheet can also be used. Document three attempts before canceling; if you cannot confirm, Epic Chat the OR scheduler. Check for CPM. If interpretation is needed, use the hospital language line (number and code on guide p. 10).")],citations:[{source:"guide",page:10,section:"1 month confirmation calls"}],reminders:["Snapboard Order email to the OR scheduling office 1–2 weeks in advance (same page)."]},{id:"npo-call",category:"NPO and confirmation calls",question:"When and how is the NPO call done?",alternates:["npo call","night before call","pre-op call","what to tell family before surgery"],keywords:["npo","call","24-48 hours","dot phrase","parking","hour and a half"],answer:[Ne("NPO call 24–48 hours in advance using the dot phrase with all info to go over. Tell them to come an hour and a half early to the scheduled start time. OR gets validated parking (IV does not). Over 18: legal guardianship paperwork/power of attorney required; foster: red border consent; social worker: Ap144B form.")],citations:[{source:"guide",page:10,section:"NPO Call"}],reminders:["For the satellite OR site, the guide states the resident does NOT need to complete the confirmation/NPO call (p. 15)."]},{id:"npo-fasting",category:"NPO and confirmation calls",question:"What are the NPO fasting times (solids, milk, clear liquids)?",alternates:["how long to fast","clear liquids before surgery","when to stop eating","fasting guidelines"],keywords:["fasting","fast","clear liquids","solids","milk","formula","breast milk","stop eating"],answer:[Ne("Not covered: neither uploaded document lists NPO fasting intervals. The guide only says to use the NPO dot phrase during the call. Follow current anesthesia/institutional instructions.")],citations:[{source:"guide",page:10,section:"NPO Call"}],reminders:[],notCovered:!0},{id:"joint-cases",category:"Joint cases",question:"What do I need to do for a joint case?",alternates:["joint case","omfs joining","combined case","third molar extractions joint","joint case email"],keywords:["joint","omfs","attending","combined","multipanel","third molar"],answer:[Ne('Sometimes OMFS will join but not have their own attending — verify the pediatric dental attending is OK overseeing the OMFS procedure (e.g. 3rd molar extractions) — usually the designated Wednesday attending. Include the OR scheduling office in joint-case emails. For consent, use "Multipanel" if a joint case in a non-dental room.'),si('Code definitions: "0-8 age that is a joint case" → 3R; with extractions → 3U.')],citations:[{source:"guide",page:13,section:"Joint cases"},{source:"guide",page:11,section:"Consent"},{source:"coding",page:1,section:"Code definitions (3R, 3U)"}],reminders:["The scheduler shows a coordination reminder but never changes the day or attending."]},{id:"case-request",category:"Epic OR workflows",question:"How do I submit an OR case request in Epic?",alternates:["case request","submit or request","general surgery preprocedure peds","or referral epic"],keywords:["case request","epic","order","preprocedure","location","or location","referral"],answer:[Ne('Submit Case Request without OR date — uncheck ready for scheduling and choose the correct OR location. Prep for Procedure tab → Orders → General Surgery Preprocedure – PEDS. Case Request Operating Room → choose the OR location. Panel 1 – Pediatric Dentistry: select the provider designated for that site (listed in the guide, p. 6). Add on case: No; DME: N/A; ERAS: No; CPM/PAT Evaluation: Yes or No; Center of Excellence: No; Ready to schedule now: No. Then submit a tx plan request: Title "[OR site] OR under GA", date blank, Department = the OR site, provider blank, Visit Type General Surgery.')],citations:[{source:"guide",page:6,section:"OR Referrals"},{source:"guide",page:7,section:"OR Referrals (cont.)"}],reminders:["A Letter of Medical Necessity is needed for all OR and IV patients at the time of case request (p. 7)."]},{id:"lmn",category:"Epic OR workflows",question:"When is a Letter of Medical Necessity needed?",alternates:["lmn","letter of medical necessity","insurance letter"],keywords:["lmn","letter","medical necessity","insurance"],answer:[Ne("Needed for all OR and IV patients at time of case request. Wrap up Tab → Communications → the peds-to-insurance medical-necessity letter template. Add diagnoses if applicable; include tx plan listing teeth by category; if more than 1 tx planned, choose the most extensive. Send (print if send is not an option).")],citations:[{source:"guide",page:7,section:"LMN – Letter of Medical Necessity"},{source:"guide",page:8,section:"LMN (cont.)"}],reminders:[]},{id:"snapboard",category:"Epic OR workflows",question:"What is the Snapboard and when is the Snapboard order emailed?",alternates:["snapboard order","snapboard email","snapboard colors","scheduling office email","main scheduler snapboard"],keywords:["snapboard","order","email","scheduling office","colors","white","red","yellow","green","blue"],answer:[Ne('OR Snapboards: one "OR – Main Scheduler" board per OR site. Colors: White – Scheduled; Red – In facility; Yellow – Preprocedure; Green – Procedure; Blue – Recovery. Email the OR scheduling office (address on guide p. 10) for the Snapboard Order 1–2 weeks in advance.'),At("The Snapboard checklist recipient is blank by default; enter your scheduling office address in Settings (stored only in your browser).")],citations:[{source:"guide",page:9,section:"OR Snapboards"},{source:"guide",page:10,section:"1 month confirmation calls"},{source:"config",section:"Settings → Snapboard recipient"}],reminders:[]},{id:"hp",category:"Epic OR workflows",question:"How do I write the OR H&P?",alternates:["history and physical","h&p","write h&p","preprocedure h&p"],keywords:["h&p","history","physical","ros","co-sign","vitals"],answer:[Ne('Preprocedure → Write H&P → H&P 1. ROS: under HENT check "Dental problem"; check "all other systems negative". Physical exam: "vitals reviewed", "nursing note reviewed"; Constitutional alert/normal appearance; Mouth/throat moist; Skin warm. Sidebar: service "Dentistry", check "Co-sign required?", enter the attending. HPI: "acute situational anxiety" and "severe dental caries"/"severe dental infection"; Assessment/Plan: "Comprehensive Oral Rehabilitation under General Anesthesia". Do not sign until nursing has entered vitals — pend until then.')],citations:[{source:"guide",page:9,section:"H&P"},{source:"guide",page:10,section:"H&P"}],reminders:["Be sure the correct attending is assigned to each case (p. 9)."]},{id:"consent",category:"Epic OR workflows",question:"How do I complete the OR consent?",alternates:["or consent","surgical consent","consent proc blood sedation"],keywords:["consent","sedation","procedure","ipad","multipanel"],answer:[Ne('Preprocedure → Consents → New Consent-Proc Blood Sedation (Surgical Case) ("Multipanel" if joint case in non-dental room) → select the case → provider, N/A laterality, and treatment list (exam, radiographs, chlorhexidine, prophylaxis, fluoride, SDF, sealants, fillings, crowns, pulpal therapy, local anesthetic, extractions including but not limited to #). Check "Procedure" and "Sedation"; "Received by" = whoever will do the consent. Scan with iPad. Discuss all tx options; verify if parent wants a call with updated tx plan; verify phone number.')],citations:[{source:"guide",page:11,section:"Consent"}],reminders:["Do not complete a consent under the wrong attending's name (p. 9)."]},{id:"discharge",category:"Epic OR workflows",question:"What are the post-OR discharge steps?",alternates:["discharge orders","post op orders","after or follow up","post or notes"],keywords:["discharge","post-procedure","follow up","recall","notes","analgesics"],answer:[Ne('Post-procedure → Discharge orders. Reconcile home medications; order "Dental Rehab Postprocedure Discharge – PEDS"; follow-up with pediatric dental clinic in 6 months (unless other time needed); Diet "see below"; non-opioid analgesics (correct pharmacy). Discharge – home, today. Create tx plan request for next appointment; if follow-up is needed before the 6-month recall, staff message the dental clerical pool named in the guide (p. 12). Post-OR notes: .mfordictation, .mwpoi — set everything complete.')],citations:[{source:"guide",page:12,section:"Discharge / Post OR Notes"}],reminders:["In clinic, do not request recall if the patient is scheduled to be seen in the OR (p. 4)."]},{id:"premed",category:"Epic OR workflows",question:"How is antibiotic premedication arranged for the OR?",alternates:["sbe prophylaxis or","antibiotic premed","premedication"],keywords:["premedication","antibiotic","prophylaxis","sbe","premed"],answer:[Ne("If needed, e-mail the two premedication contacts listed in the guide (p. 13). Put the antibiotic order in at least by the day before (where you place case request orders) and link that premed order as pre-op. Dosing references for SBE prophylaxis appear on guide p. 24.")],citations:[{source:"guide",page:13,section:"Premedication in OR (antibiotic prophylaxis)"},{source:"guide",page:24,section:"Premed – SBE antibiotic prophylaxis"}],reminders:[]},{id:"or-day-arrival",category:"Operating room preparation",question:"What should residents do on arrival on OR day?",alternates:["or day preparation","morning of surgery","what to do when you arrive","face sheets","attending specific tasks"],keywords:["arrival","h&p","consents","attending","face sheets","notecards","prepare"],answer:[Ne("Upon arrival, do H&Ps and prepare consents (can be done ahead of time, but be sure date/time is accurate). Be sure the correct attending is assigned to each case. If the attending named in the guide (p. 11) is assigned, print face sheets (OR Snapboard → right-click appointment → Print Forms → Registration Face Sheet) and have notecards ready listing teeth by category.")],citations:[{source:"guide",page:9,section:"OR (GA)"},{source:"guide",page:11,section:"Consent"}],reminders:[]},{id:"in-room",category:"Operating room preparation",question:"What are the key in-room OR procedures (throat pack, intubation, handoff)?",alternates:["throat pack","nasotracheal","oropharynx clear","in the or room","handoff to recovery"],keywords:["throat pack","intubation","nasotracheal","oropharynx","anesthesia","recovery","handoff"],answer:[Ne('Say "Throat pack going in" (recorded procedure start time). Tell anesthesia when you have 10–15 minutes left. Say "Throat pack out", check the mouth, suction and say "Oropharynx clear and free of debris". Intubation is usually nasotracheal (oral if not possible). Know which nare was used, IV location, number of decayed teeth, EBL and mg of anesthetic used. One person stays with the patient and relays completed treatment to the post-op nurse; another can consent the next patient, complete discharge and talk with parents.')],citations:[{source:"guide",page:12,section:"In OR procedure room"},{source:"guide",page:13,section:"In OR procedure room (cont.)"}],reminders:[]},{id:"vaccine",category:"Operating room preparation",question:"Can a vaccine be given in the OR?",alternates:["vaccine in or","immunization during surgery"],keywords:["vaccine","immunization","pharmacist","hospital performed"],answer:[Ne(`The physician must place it as "hospital performed" (not "clinic performed") linked to the surgical encounter. Tell the OR pharmacist (named in the guide) before DOS so the vaccine is available and pharmacy can discuss with the guardian day of surgery. Make sure anesthesia is aware — some providers are willing to administer and some aren't.`)],citations:[{source:"guide",page:14,section:"Vaccine requested to be administered in the OR"}],reminders:[]},{id:"anesthetic-max",category:"Operating room preparation",question:"How do I calculate the local anesthetic maximum dose?",alternates:["max dose lidocaine","local anesthetic calculation","lido max dose"],keywords:["anesthetic","lidocaine","max dose","mg/kg","epi"],answer:[Ne('Guide formula: weight (kg) × 5 mg/kg = max dose in mg. 1% = 10 mg/mL; 2% = 20 mg/mL. For 1% lido (used in OR): max dose in mg × mL/10 mg = max dose in mL. (The guide also notes "[Max dose of anesthetic – Divide weight in kg by 2]".)')],citations:[{source:"guide",page:23,section:"Other helpful information"},{source:"guide",page:24,section:"Other helpful information (cont.)"}],reminders:["Verify against current references and your attending — the scheduler does not perform dose calculations."]},{id:"or-contacts",category:"Operating room preparation",question:"Who are the OR contacts
